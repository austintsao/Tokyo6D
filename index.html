<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>東京旅遊 Tokyo Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
/* ============================================================
   TOKYO TRAVEL — design tokens
   Light: rice-paper / off-white magazine ground
   Dark:  ink-black with the same hinomaru red accent
   ============================================================ */
:root{
  --bg:#FAF8F3;
  --surface:#FFFFFF;
  --surface-2:#F2EEE4;
  --surface-3:#EAE4D6;
  --ink:#1C1A17;
  --ink-soft:#6E6858;
  --ink-faint:#9A947F;
  --line:#E3DDCC;
  --line-strong:#CFC8B4;
  --accent:#BC002D;
  --accent-ink:#FFFFFF;
  --accent-soft:#F8E4E2;
  --accent-soft-line:#EBC3C0;
  --good:#3F7A4E;
  --shadow: 0 1px 2px rgba(28,26,23,.04), 0 8px 24px -12px rgba(28,26,23,.18);
  --radius-s:3px;
  --radius-m:6px;
  --radius-l:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151310;
    --surface:#1C1914;
    --surface-2:#242018;
    --surface-3:#2E291F;
    --ink:#F3EEE2;
    --ink-soft:#B7AF9B;
    --ink-faint:#867E6A;
    --line:#37311F;
    --line-strong:#493F27;
    --accent:#FF5C6C;
    --accent-ink:#1C1310;
    --accent-soft:#3A2020;
    --accent-soft-line:#5C2E30;
    --good:#7BC28E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#151310;
  --surface:#1C1914;
  --surface-2:#242018;
  --surface-3:#2E291F;
  --ink:#F3EEE2;
  --ink-soft:#B7AF9B;
  --ink-faint:#867E6A;
  --line:#37311F;
  --line-strong:#493F27;
  --accent:#FF5C6C;
  --accent-ink:#1C1310;
  --accent-soft:#3A2020;
  --accent-soft-line:#5C2E30;
  --good:#7BC28E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans TC','Hiragino Sans',system-ui,sans-serif;
  font-feature-settings:"palt";
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;color:inherit;}
img{display:block;}
::selection{background:var(--accent-soft);color:var(--accent);}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

.font-display{font-family:'Shippori Mincho','Noto Serif TC',serif;}
.font-mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
.tnum{font-variant-numeric:tabular-nums;}

.container{max-width:1180px;margin:0 auto;padding-inline:20px;}
@media (min-width:768px){.container{padding-inline:32px;}}

.hairline{border-top:1px solid var(--line);}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font-size:.86rem;font-weight:600;letter-spacing:.01em;
  padding:.62em 1.15em;border-radius:var(--radius-s);
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:color-mix(in srgb, var(--accent) 88%, black 0%);filter:brightness(1.05);}
.btn-outline{background:transparent;border-color:var(--line-strong);color:var(--ink);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink);background:var(--surface-2);}
.btn-sm{font-size:.78rem;padding:.42em .85em;}
.btn-icon{padding:.5em;border-radius:999px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);}
.card-shadow{box-shadow:var(--shadow);}

/* ---- badges ---- */
.badge{
  display:inline-flex;align-items:center;gap:.3em;
  font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.3em .6em;border-radius:2px;line-height:1;
}
.badge-new{background:var(--ink);color:var(--bg);}
.badge-hot{background:var(--accent);color:var(--accent-ink);}
.badge-outline{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft);}
.badge-demo{background:var(--surface-3);color:var(--ink-soft);border:1px solid var(--line);}

/* ---- boarding pass motif ---- */
.ticket{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-l);box-shadow:var(--shadow);
}
.ticket-perf{
  position:relative;height:0;border-top:1.5px dashed var(--line-strong);margin:0 22px;
}
.ticket-perf::before,.ticket-perf::after{
  content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
}
.ticket-perf::before{left:-31px;}
.ticket-perf::after{right:-31px;}
.barcode{
  height:28px;
  background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 11px, var(--ink) 11px 14px, transparent 14px 17px);
  opacity:.85;
}

/* ---- timeline ---- */
.timeline{position:relative;padding-left:64px;}
.timeline::before{
  content:"";position:absolute;left:20px;top:6px;bottom:6px;width:1px;background:var(--line-strong);
}
.tl-row{position:relative;padding-bottom:36px;}
.tl-row:last-child{padding-bottom:4px;}
.tl-time{
  position:absolute;left:-64px;top:0;width:52px;text-align:right;
  font-size:.72rem;color:var(--ink-faint);padding-top:2px;
}
.tl-dot{
  position:absolute;left:-45px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink-soft);
}
.tl-dot.is-meal{border-color:var(--accent);background:var(--accent-soft);}
.tl-dot.is-transit{border-color:var(--line-strong);background:var(--bg);width:7px;height:7px;left:-43px;}

/* ---- scroll rows ---- */
.scroll-x{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.scroll-x::-webkit-scrollbar{height:5px;}
.scroll-x::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px;}
.scroll-x > *{scroll-snap-align:start;flex-shrink:0;}

/* ---- image placeholder (illustrative, no external photos) ---- */
.ph-img{position:relative;overflow:hidden;background:var(--surface-3);}
.ph-img::after{content:attr(data-em);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;filter:saturate(.9);}
.ph-img::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg, rgba(188,0,45,.10), transparent 55%);}

/* ---- mobile bottom nav ---- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:.64rem;color:var(--ink-faint);}
.bn-item.is-active{color:var(--accent);}

/* ---- toast ---- */
.toast-wrap{position:fixed;left:0;right:0;bottom:78px;z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px;}
@media (min-width:768px){.toast-wrap{bottom:28px;}}
.toast{
  pointer-events:auto;background:var(--ink);color:var(--bg);font-size:.82rem;
  padding:.7em 1.1em;border-radius:var(--radius-m);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:.6em;max-width:420px;
}

.balance{text-wrap:balance;}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .5s ease both;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin 1.1s linear infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.pulse{animation:pulse 1.4s ease-in-out infinite;}
</style>
</head>

<script>
/* ============================================================
   /src/lib/config.ts — API key storage
   ------------------------------------------------------------
   Secret / browser API keys are NEVER hardcoded in this file.
   The user enters them on the Settings page and they are kept
   ONLY in this browser's localStorage — nothing is baked into
   the source, nothing is committed anywhere. If no key is set,
   every feature below still works using the Mock providers.
   ============================================================ */
const CONFIG_KEY = "tokyo6d:config:v1";
const configListeners = new Set();
function readConfig() {
    try {
        const raw = localStorage.getItem(CONFIG_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return { googleMapsKey: parsed.googleMapsKey || "", debugMode: !!parsed.debugMode };
    }
    catch (e) {
        return { googleMapsKey: "", debugMode: false };
    }
}
function writeConfig(patch) {
    const next = { ...readConfig(), ...patch };
    try {
        localStorage.setItem(CONFIG_KEY, JSON.stringify(next));
    }
    catch (e) { }
    configListeners.forEach(fn => fn(next));
    return next;
}
function useConfig() {
    const [config, setConfigState] = useState(() => readConfig());
    useEffect(() => {
        const listener = (next) => setConfigState(next);
        configListeners.add(listener);
        return () => configListeners.delete(listener);
    }, []);
    return [config, writeConfig];
}
function hasGoogleMapsKey() { return !!readConfig().googleMapsKey; }
/* ============================================================
   /src/lib/utils/cache.ts — memory + localStorage cache (TTL)
   Cache keys follow: place:{placeId}, weather:{lat}:{lng}:{date},
   route:{origin}:{destination}, restaurant:{query}:{location}
   ============================================================ */
const CACHE_PREFIX = "tokyo6d:cache:";
const memoryCache = new Map();
const CacheStore = {
    get(key) {
        const hit = memoryCache.get(key);
        if (hit && hit.expiresAt > Date.now())
            return hit.value;
        if (hit)
            memoryCache.delete(key);
        try {
            const raw = localStorage.getItem(CACHE_PREFIX + key);
            if (!raw)
                return undefined;
            const parsed = JSON.parse(raw);
            if (parsed.expiresAt > Date.now()) {
                memoryCache.set(key, parsed);
                return parsed.value;
            }
            localStorage.removeItem(CACHE_PREFIX + key);
        }
        catch (e) { }
        return undefined;
    },
    set(key, value, ttlMs = 10 * 60 * 1000) {
        const entry = { value, expiresAt: Date.now() + ttlMs };
        memoryCache.set(key, entry);
        try {
            localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(entry));
        }
        catch (e) { }
    },
};
/* ============================================================
   /src/lib/utils/backoff.ts — exponential backoff on 429 / quota
   ============================================================ */
function isRateLimitError(err) {
    const msg = String((err && (err.message || err.status)) || err || "").toUpperCase();
    return msg.includes("429") || msg.includes("OVER_QUERY_LIMIT") || msg.includes("RESOURCE_EXHAUSTED");
}
async function withBackoff(fn, { retries = 2, baseDelayMs = 700 } = {}) {
    let attempt = 0;
    for (;;) {
        try {
            return await fn();
        }
        catch (err) {
            if (attempt >= retries || !isRateLimitError(err))
                throw err;
            await new Promise(r => setTimeout(r, baseDelayMs * Math.pow(2, attempt)));
            attempt += 1;
        }
    }
}
/* ============================================================
   /src/lib/debug.ts — records every real API call for the
   Settings 頁「API Debug Mode」面板（僅開發模式顯示）
   ============================================================ */
function _rid(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
const debugLogListeners = new Set();
let debugLogEntries = [];
function logDebug(entry) {
    const row = { id: _rid("log"), time: new Date(), ...entry };
    debugLogEntries = [row, ...debugLogEntries].slice(0, 60);
    debugLogListeners.forEach(fn => fn(debugLogEntries));
}
function useDebugLog() {
    const [entries, setEntries] = useState(() => debugLogEntries);
    useEffect(() => {
        const listener = (next) => setEntries(next);
        debugLogListeners.add(listener);
        return () => debugLogListeners.delete(listener);
    }, []);
    return entries;
}

   ============================================================ */
const apiStatusListeners = new Set();
let apiStatus = { maps: "demo", weather: "checking", places: "demo", restaurants: "demo" };
function setApiStatus(patch) {
    apiStatus = { ...apiStatus, ...patch };
    apiStatusListeners.forEach(fn => fn(apiStatus));
}
function useApiStatus() {
    const [status, setStatus] = useState(() => apiStatus);
    useEffect(() => {
        const listener = (next) => setStatus(next);
        apiStatusListeners.add(listener);
        return () => apiStatusListeners.delete(listener);
    }, []);
